name: Publish CI Output

# 构建结束后，把「本次 run 的全量日志 + 产物」发布到 ci-output 分支。
# 该分支走 github.com / raw.githubusercontent.com，外部可直接读取；
# 而 Actions 自带的 artifact 下载域名在部分网络环境不可达。
on:
  workflow_run:
    workflows: ["Build All OnePlus Kernels"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "要收集的 run id（留空=最近一次完成的构建）"
        required: false
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Collect logs and artifacts, publish to ci-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # GitHub 默认以 bash -e 执行；这里改为「尽量都发布、关键处显式判错」
          set +e
          set -uo pipefail
          API="https://api.github.com"
          H=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # ---------- 1. 确定目标 run ----------
          RUN_ID="${IN_RUN_ID:-}"
          [ -n "$RUN_ID" ] || RUN_ID="${WR_RUN_ID:-}"
          if [ -z "$RUN_ID" ]; then
            curl -fsSL --max-time 60 "${H[@]}" "$API/repos/$REPO/actions/runs?per_page=30" -o /tmp/runs.json || true
            RUN_ID=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/runs.json'))
          except Exception:
              d = {}
          for r in d.get('workflow_runs', []):
              if r.get('name') == 'Build All OnePlus Kernels' and r.get('status') == 'completed':
                  print(r['id']); break
          PY
            )
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::无法确定 run_id"
            exit 1
          fi
          echo "目标 run_id=$RUN_ID  (attempt=${WR_ATTEMPT:-?}, conclusion=${WR_CONCLUSION:-manual})"

          OUT="$RUNNER_TEMP/ciout"
          rm -rf "$OUT"
          mkdir -p "$OUT/logs" "$OUT/artifacts" "$OUT/meta"

          # ---------- 2. 全量日志 ----------
          LOG_OK=0
          for i in 1 2 3; do
            if curl -fsSL --max-time 240 "${H[@]}" "$API/repos/$REPO/actions/runs/$RUN_ID/logs" -o "$OUT/logs/run_logs.zip" && [ -s "$OUT/logs/run_logs.zip" ]; then
              LOG_OK=1
              break
            fi
            echo "日志下载重试 $i ..."
            sleep 10
          done
          if [ "$LOG_OK" = "1" ]; then
            (cd "$OUT/logs" && unzip -o -q run_logs.zip) || true
            TMPTXT=$(mktemp)
            find "$OUT/logs" -type f -name '*.txt' -print0 | sort -z | xargs -0 -r cat > "$TMPTXT" 2>/dev/null || true
            [ -s "$TMPTXT" ] || echo "(日志压缩包内未找到 txt)" > "$TMPTXT"
            mv "$TMPTXT" "$OUT/logs/build_log.txt"
            echo "✅ 日志 OK"
          else
            echo "⚠️ 日志下载失败（可能已过期）" > "$OUT/logs/build_log.txt"
            rm -f "$OUT/logs/run_logs.zip"
          fi

          # ---------- 3. 产物 ----------
          if curl -fsSL --max-time 120 "${H[@]}" "$API/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" -o "$OUT/meta/artifacts.json"; then
            python3 - "$OUT" <<'PY' || true
          import json, os, subprocess, sys
          out = sys.argv[1]
          tok = os.environ['GH_TOKEN']
          try:
              d = json.load(open(out + '/meta/artifacts.json'))
          except Exception:
              d = {'artifacts': []}
          for a in d.get('artifacts', []):
              if a.get('expired'):
                  continue
              name = str(a['name']).replace('/', '_')
              dest = os.path.join(out, 'artifacts', name + '.zip')
              rc = subprocess.run([
                  'curl', '-fsSL', '--max-time', '300',
                  '-H', 'Authorization: Bearer ' + tok,
                  '-H', 'Accept: application/vnd.github+json',
                  '-o', dest, a['archive_download_url']
              ]).returncode
              ok = rc == 0 and os.path.exists(dest) and os.path.getsize(dest) > 0
              print(('OK   ' if ok else 'FAIL ') + name)
              if not ok and os.path.exists(dest):
                  os.remove(dest)
          PY
          else
            echo '{"artifacts":[]}' > "$OUT/meta/artifacts.json"
            echo "⚠️ 产物列表获取失败"
          fi

          # ---------- 4. 清单 ----------
          {
            echo "# CI Output"
            echo "run_id=$RUN_ID"
            echo "run_url=https://github.com/$REPO/actions/runs/$RUN_ID"
            echo "conclusion=${WR_CONCLUSION:-manual}"
            echo "head_sha=${WR_SHA:-}"
            echo "head_branch=${WR_BRANCH:-}"
            echo "collected_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## artifacts"
            find "$OUT/artifacts" -maxdepth 1 -type f -printf '%f  %s bytes\n' | sort
            echo
            echo "## logs"
            find "$OUT/logs" -maxdepth 2 -type f -printf '%f  %s bytes\n' | sort
          } > "$OUT/meta/manifest.txt"
          cat "$OUT/meta/manifest.txt"

          # ---------- 5. 用 GitHub REST API 发布到 ci-output 分支 ----------
          # 全程只用 api.github.com，不依赖 git 命令 / git smart http，
          # 避免部分网络环境拦截 git 端点。每次创建一个无父提交的 root commit
          # 并 force 更新 ref，历史不会累积，仓库体积恒定。
          OUTDIR="$OUT" RUN_ID="$RUN_ID" python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error

          repo = os.environ['REPO']
          tok = os.environ['GH_TOKEN']
          run_id = str(os.environ['RUN_ID'])
          out = os.environ['OUTDIR']
          API = 'https://api.github.com/repos/' + repo

          def req(method, path, data=None, timeout=180):
              body = json.dumps(data).encode() if data is not None else None
              r = urllib.request.Request(API + path, data=body, method=method, headers={
                  'Authorization': 'Bearer ' + tok,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ci-output-publisher'
              })
              with urllib.request.urlopen(r, timeout=timeout) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}

          files = {}
          for sub in ('logs', 'artifacts', 'meta'):
              for root, dirs, names in os.walk(os.path.join(out, sub)):
                  for n in names:
                      p = os.path.join(root, n)
                      files['latest/' + os.path.relpath(p, out).replace(os.sep, '/')] = p
          files['manifest.txt'] = os.path.join(out, 'meta', 'manifest.txt')

          readme = (
              '# CI 输出（自动发布）\n\n'
              '由 `Publish CI Output` 工作流在每次构建结束后生成，`latest/` 每次覆盖。\n\n'
              '- `manifest.txt` 运行信息与文件清单\n'
              '- `latest/logs/build_log.txt` 全量构建日志（合并纯文本，可直接阅读）\n'
              '- `latest/logs/run_logs.zip` 原始日志包\n'
              '- `latest/artifacts/*.zip` 产物（AnyKernel3 / ZRAM 模块）\n\n'
              '本次 run: https://github.com/' + repo + '/actions/runs/' + run_id + '\n'
              '旧 run：Actions -> Publish CI Output -> Run workflow，填 run_id 即可重新收集。\n'
          )

          tree = []
          items = [(k, v) for k, v in sorted(files.items()) if os.path.isfile(v)]
          items.append(('README.md', None))
          for rel, disk in items:
              raw = readme.encode() if disk is None else open(disk, 'rb').read()
              if not raw:
                  continue
              b = req('POST', '/git/blobs',
                      {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'},
                      timeout=300)
              tree.append({'path': rel, 'mode': '100644', 'type': 'blob', 'sha': b['sha']})
              print('  blob %-58s %d bytes' % (rel, len(raw)))

          t = req('POST', '/git/trees', {'tree': tree})
          c = req('POST', '/git/commits',
                  {'message': 'ci: logs & artifacts for run ' + run_id,
                   'tree': t['sha'], 'parents': []})
          sha = c['sha']
          try:
              req('PATCH', '/git/refs/heads/ci-output', {'sha': sha, 'force': True})
              print('  ci-output 分支已更新')
          except urllib.error.HTTPError as e:
              if e.code in (404, 422):
                  req('POST', '/git/refs', {'ref': 'refs/heads/ci-output', 'sha': sha})
                  print('  ci-output 分支已创建')
              else:
                  raise
          print('OK  https://github.com/' + repo + '/tree/ci-output')
          print('RAW https://raw.githubusercontent.com/' + repo + '/ci-output/latest/logs/build_log.txt')
          PY
          PUB_RC=$?
          if [ "$PUB_RC" != "0" ]; then
            echo "::error::发布失败 (rc=$PUB_RC)"
            exit 1
          fi
          echo "✅ 已发布：https://github.com/$REPO/tree/ci-output"
